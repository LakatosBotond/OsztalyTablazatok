<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanulók</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <main>
        <h1>Tanulók</h1>
        <h2>Tanuló hozzáadása:</h2>

        <div id="tanulok">
            <input type="text" id="nev" placeholder="Név">
            <input type="number" id="OsztalySzam" placeholder="1-12" min="1" max="12">
            <input type="text" id="OsztalyBetu" placeholder="A-Z" maxlength="1">
            <input type="number" id="atlag" placeholder="Átlag" min="1" max="5" step="0.01">
            <button onclick="hozzaad()">Hozzáadás</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Név</th>
                    <th>Osztály</th>
                    <th>Átlag</th>
                    <th>Műveletek</th>
                </tr>
            </thead>
            <tbody id="tanuloTabla"></tbody>
        </table>

        <div id="tanulokStatisztikak"> 
            <h3>Statisztikák:</h3>
            <div>
                <p id="tanulokSzama" class="stats1"></p>
                <p id="OsszAtlag" class="stats"></p>
                <p id="legjobbTanulo" class="stats"></p>


            </div>

            
        </div>



    </main>

    <script src="main.js"></script>
</body>
</html>
